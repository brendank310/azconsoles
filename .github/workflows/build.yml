name: Build

on:
  push:
    branches: [ main, copilot/fix-1 ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.21'
        
    - name: Build binaries
      run: make all
      
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: azconsoles-binaries
        path: bin/
        retention-days: 30
        
    - name: Run tests
      run: go test ./pkg/...
      
    - name: Verify code formatting
      run: |
        go fmt ./...
        if [ -n "$(git diff --name-only)" ]; then
          echo "Code is not formatted. Run 'go fmt ./...' to fix."
          exit 1
        fi